<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cricket Auction — Login</title>
<style>
  :root {
    --bg: #0a0e14; --surface: #131922; --surface-2: #1a2230; --border: #263041;
    --text: #eef2f7; --text-dim: #8b96a8; --accent: #22c58b; --accent-dim: #17976a;
    --danger: #ef4b52; --purple: #a385f0; --info: #4c9eff; --radius: 16px;
    --shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  * { box-sizing:border-box; }
  body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(circle at top, #101722 0%, var(--bg) 60%);
    color:var(--text); margin:0; min-height:100vh; padding:40px 16px;
    display:flex; flex-direction:column; align-items:center; }
  input, button { padding:13px; margin:5px 0; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:1rem; width:100%; box-sizing:border-box; }
  input:focus { outline:2px solid var(--accent-dim); outline-offset:1px; }
  button { cursor:pointer; background:var(--accent); border:none; font-weight:700; color:#04241a;
    transition:transform .08s ease, filter .15s ease; }
  button:hover { filter:brightness(1.08); }
  button:active { transform:scale(0.98); }
  button.secondary { background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  h1 { font-size:1.4rem; font-weight:700; margin:0 0 24px; text-align:center; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:26px; margin-bottom:16px; max-width:420px; width:100%; box-shadow:var(--shadow); }
  .auctionRow { display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 4px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .auctionRow button { width:auto; padding:8px 16px; }
  .roleBadge { font-size:0.72rem; padding:3px 9px; border-radius:999px; margin-left:6px; font-weight:600; }
  .role-OWNER { background:rgba(163,133,240,0.18); color:var(--purple); }
  .role-HOST { background:rgba(76,158,255,0.18); color:var(--info); }
  .role-TEAM_OWNER { background:rgba(34,197,139,0.18); color:var(--accent); }
  #error, #regError { color:var(--danger); font-size:0.9rem; }
  details summary { cursor:pointer; color:var(--text-dim); }

  @media (max-width: 480px) {
    body { padding:24px 12px; }
    .panel { padding:20px; border-radius:14px; }
  }
</style>
</head>
<body>

<h1>🏏 Cricket Auction Platform</h1>

<div class="panel" id="loginPanel">
  <h2>Login</h2>
  <input id="username" placeholder="Username" style="width:100%;box-sizing:border-box" /><br/>
  <input id="password" type="password" placeholder="Password" style="width:100%;box-sizing:border-box" /><br/>
  <button onclick="login()">Login</button>
  <div id="error"></div>

  <details style="margin-top:14px">
    <summary style="cursor:pointer;color:#8b949e">New here? Register</summary>
    <input id="regUsername" placeholder="Username (3-20 chars, letters/numbers/_)" style="width:100%;box-sizing:border-box;margin-top:8px" /><br/>
    <input id="regPassword" type="password" placeholder="Password (min 8 characters)" style="width:100%;box-sizing:border-box" /><br/>
    <input id="regName" placeholder="Display name (optional)" style="width:100%;box-sizing:border-box" /><br/>
    <button onclick="register()" class="secondary">Register</button>
    <div id="regError"></div>
  </details>
</div>

<div class="panel" id="auctionsPanel" style="display:none">
  <h2>Your Auctions</h2>
  <div id="auctionList"></div>
  <button onclick="goCreateAuction()" style="margin-top:12px">+ Create New Auction</button>
  <div style="margin-top:10px"><button onclick="logout()" class="secondary">Logout</button></div>
</div>

<script>
const API = `${window.location.origin}/api`;

async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const res = await fetch(`${API}/login`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ username, password }) });
  const data = await res.json();
  if (!res.ok) { document.getElementById("error").innerText = data.error; return; }

  localStorage.setItem("cricketAuction_token", data.token);
  await loadAuctions();
}

async function register() {
  const username = document.getElementById("regUsername").value;
  const password = document.getElementById("regPassword").value;
  const displayName = document.getElementById("regName").value;
  const res = await fetch(`${API}/register`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ username, password, displayName }) });
  const data = await res.json();
  if (!res.ok) { document.getElementById("regError").innerText = data.error; return; }
  document.getElementById("regError").style.color = "#3fb950";
  document.getElementById("regError").innerText = "Registered! You can log in now.";
}

async function loadAuctions() {
  const token = localStorage.getItem("cricketAuction_token");
  if (!token) return;

  const res = await fetch(`${API}/auctions`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) { logout(); return; } // token expired/invalid — send back to login
  const auctions = await res.json();

  document.getElementById("loginPanel").style.display = "none";
  document.getElementById("auctionsPanel").style.display = "block";

  const roleLabel = { OWNER: "Owner", HOST: "Host", TEAM_OWNER: "Team Owner" };
  document.getElementById("auctionList").innerHTML = auctions.length
    ? auctions.map(a => `
      <div class="auctionRow">
        <div>${escapeHtml(a.name)} <span style="color:#8b949e">[${escapeHtml(a.status)}]</span>
          <span class="roleBadge role-${a.role}">${roleLabel[a.role] || a.role}</span>
        </div>
        <button onclick="openAuction('${a.id}', '${encodeURIComponent(a.name)}', '${a.role}')">Open</button>
      </div>`).join("")
    : "<div style='color:#8b949e'>You're not part of any auction yet. Create one below.</div>";
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// This is the actual role-based routing decision: OWNER and HOST both
// get the control-room dashboard (host.html); TEAM_OWNER gets the
// bidding dashboard (team-owner.html). Decided once, right here, right
// after login — the person never has to know or choose which file to open.
function openAuction(auctionId, encodedName, role) {
  localStorage.setItem("cricketAuction_activeAuctionId", auctionId);
  localStorage.setItem("cricketAuction_activeAuctionName", decodeURIComponent(encodedName));
  localStorage.setItem("cricketAuction_role", role);
  window.location.href = (role === "TEAM_OWNER") ? "team-owner.html" : "host.html";
}

function goCreateAuction() {
  // Creating an auction always makes you its OWNER — send straight to
  // the host dashboard, which already has the Create Auction form.
  localStorage.removeItem("cricketAuction_activeAuctionId");
  window.location.href = "host.html";
}

function logout() {
  localStorage.removeItem("cricketAuction_token");
  localStorage.removeItem("cricketAuction_activeAuctionId");
  localStorage.removeItem("cricketAuction_activeAuctionName");
  localStorage.removeItem("cricketAuction_role");
  document.getElementById("loginPanel").style.display = "block";
  document.getElementById("auctionsPanel").style.display = "none";
}

// If already logged in (token saved from a previous visit), skip straight to the auction list.
if (localStorage.getItem("cricketAuction_token")) loadAuctions();
</script>
</body>
</html>
